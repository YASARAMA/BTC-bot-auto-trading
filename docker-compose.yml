services:
  bot:
    build: .
    container_name: btc-bot
    restart: unless-stopped
    env_file:
      - .env                      # EXCHANGE_API_KEY, EXCHANGE_API_SECRET, LIVE_TRADING, webhooks
    volumes:
      - ./data:/app/data          # sqlite state, kill switch (touch ./data/KILL_SWITCH on the host)
      - ./config.yaml:/app/config.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    stop_grace_period: 30s
