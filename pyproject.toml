[project]
name = "btc-bot"
version = "0.1.0"
description = "Automated BTC spot trading bot with paper trading, strict risk limits and a backtester"
requires-python = ">=3.11"
dependencies = [
  "ccxt>=4.4,<5",
  "pandas>=2.2,<4",
  "numpy>=1.26",
  "pydantic>=2.6,<3",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]

[tool.setuptools.packages.find]
include = ["bot*"]
