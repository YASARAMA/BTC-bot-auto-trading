name: Build Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  build-windows:
    name: Build BTCBot.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-gui.txt
      - name: Tests (Windows)
        run: pytest -q
      - name: Build info
        id: ver
        shell: pwsh
        run: |
          $version = (Select-String -Path bot/ui/app.py -Pattern 'VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $info = @{ version = $version; build = [int]$env:GITHUB_RUN_NUMBER; commit = $env:GITHUB_SHA; built_at = (Get-Date).ToUniversalTime().ToString("o") }
          $info | ConvertTo-Json | Set-Content -Path bot/ui/build_info.json -Encoding utf8
          Get-Content bot/ui/build_info.json
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version-build.$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT
      - name: Build executables
        run: pyinstaller --clean --noconfirm btcbot.spec
      - name: Smoke test the console build
        shell: pwsh
        run: |
          $out = & dist\BTCBot-console.exe --smoke --root "$env:RUNNER_TEMP\btcbot-smoke"
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed" }
      - name: Package and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist\BTCBot.exe, dist\BTCBot-console.exe, README.md package\
          Compress-Archive -Path package\* -DestinationPath BTCBot-windows.zip -Force
          $lines = foreach ($f in @("dist\BTCBot.exe", "dist\BTCBot-console.exe", "BTCBot-windows.zip")) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(); "$h  $(Split-Path $f -Leaf)"
          }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BTCBot-windows
          path: |
            dist/BTCBot.exe
            dist/BTCBot-console.exe
            BTCBot-windows.zip
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish release (the app self-updates from here)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BTC Bot v${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          body: |
            Automated build of `${{ github.sha }}` from `${{ github.ref_name }}`.

            ${{ github.event.head_commit.message }}
          make_latest: true
          files: |
            dist/BTCBot.exe
            dist/BTCBot-console.exe
            BTCBot-windows.zip
            SHA256SUMS.txt
      - name: Attach to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BTCBot.exe
            dist/BTCBot-console.exe
            BTCBot-windows.zip
            SHA256SUMS.txt
